[project]
name = "try-working-hard"
version = "2.0.0"
description = "Scheduled subtle mouse movement on Windows (GUI)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "matplotlib>=3.8.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.scripts]
try-working-hard = "mouse_jiggler:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# With project name try-working-hard, hatchling defaults to a try_working_hard package dir;
# the real package is mouse_jiggler, so we pin it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["mouse_jiggler"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pyright>=1.1.414",
    "pytest>=8.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
# Most existing lines stay under 100 characters; E501 is ignored below, so this
# only guides editors and any future formatter.
line-length = 100

[tool.ruff.lint]
# Lint for real bugs only (pyflakes, pycodestyle errors/warnings, bugbear).
# Left out on purpose, to avoid touching many lines while other branches are in flight:
#   I  (import sorting)    - would reorder imports in several modules.
#   UP (pyupgrade)         - would rewrite typing imports (e.g. typing.Callable).
select = ["E", "F", "W", "B"]
ignore = [
    "E501", # line-too-long: ~90 existing long lines (mostly strings and UI calls).
    "E741", # ambiguous-variable-name: style only (e.g. `l` for "light").
]

[tool.pyright]
# Lenient baseline. The UI is built from mixins (ui_*.py) that use attributes
# defined on other mixins / MouseJigglerApp, which pyright cannot see, so
# attribute-access checks are off. Remaining categories are downgraded to
# warnings so `uv run pyright` exits 0 and new *errors* fail CI; tighten these
# back to errors as the warnings are fixed.
pythonVersion = "3.10"
include = ["mouse_jiggler", "tests"]
typeCheckingMode = "basic"
reportAttributeAccessIssue = false
reportArgumentType = "warning"
reportOptionalMemberAccess = "warning"
reportOperatorIssue = "warning"
