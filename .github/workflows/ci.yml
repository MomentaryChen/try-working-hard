name: CI

on:
  pull_request:
    branches:
      - develop
      # Release PRs (release/* -> master). Tag pushes are handled by release.yml.
      - master
  push:
    branches:
      - develop
      - "dev/**"
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        # setup-uv no longer publishes floating major tags (v8+), so pin the release.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      # Includes the ruff lint hook (see .pre-commit-config.yaml).
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Type check (pyright)
        run: uv run pyright

      - name: Run tests
        run: uv run pytest
